<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boeing 737</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: linear-gradient(#dfe9f5, #f7fafd); font-family: system-ui, sans-serif; overflow: hidden; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
  #hint { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 13px; color: #4a5a6a; pointer-events: none; }
</style>
</head>
<body>
<model-viewer src="model.glb" alt="Boeing 737"
  camera-controls auto-rotate touch-action="pan-y" shadow-intensity="1">
</model-viewer>
<div id="hint">Вращайте мышью или пальцем · колесо мыши или щипок — приближение</div>
</body>
</html>
